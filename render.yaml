services:
  - type: web
    name: aria-original-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ARIA_ALLOWED_MODELS
        value: gpt-4o-mini,gpt-4.1,gpt-image-1
      - key: ARIA_REQUESTS_PER_MINUTE
        value: "12"
