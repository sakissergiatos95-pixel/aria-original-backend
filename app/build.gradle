plugins { id 'com.android.application' }

android {
    buildFeatures {
        buildConfig true
    }

    namespace 'com.aria.assistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.aria.original.v117"
        minSdk 30
        targetSdk 28
        versionCode 117
        versionName '2.2.5-original'
        ndk { abiFilters 'arm64-v8a' }
    }

    sourceSets { main { jniLibs.srcDirs = ['src/main/jniLibs'] } }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/*.so']
        }
    }
}
